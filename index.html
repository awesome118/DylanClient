<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Loading Minecraft client…</title>
  <style>
    :root { color-scheme: dark; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center;
      background: #090d16; color: #eef3ff; font: 16px/1.5 system-ui, sans-serif; }
    main { width: min(560px, calc(100% - 40px)); padding: 28px; box-sizing: border-box;
      border: 1px solid #2a3550; border-radius: 16px; background: #111827; }
    h1 { font-size: 1.25rem; margin: 0 0 10px; }
    p { color: #c4cce0; }
    progress { width: 100%; height: 18px; }
    #status { font-variant-numeric: tabular-nums; }
    #error { color: #ffb4b4; white-space: pre-wrap; }
  </style>
</head>
<body>
  <main>
    <h1>Loading the Minecraft client</h1>
    <p>The client is split into smaller files for browser-based GitHub uploads. Keep this tab open while it loads.</p>
    <progress id="bar" max="5" value="0"></progress>
    <p id="status">Preparing download…</p>
    <p id="error" role="alert"></p>
    <noscript>This page requires JavaScript to join the client files.</noscript>
  </main>
<script>
(async () => {
  const parts = [
      "client.part01.bin",
      "client.part02.bin",
      "client.part03.bin",
      "client.part04.bin",
      "client.part05.bin"
  ];
  const expectedBytes = 84938122;
  const bar = document.getElementById('bar');
  const status = document.getElementById('status');
  const error = document.getElementById('error');
  const buffers = [];
  let total = 0;
  try {
    for (let i = 0; i < parts.length; i++) {
      status.textContent = `Downloading part ${i + 1} of ${parts.length}…`;
      const response = await fetch(parts[i], {cache: 'no-store'});
      if (!response.ok) throw new Error(`Could not download ${parts[i]} (HTTP ${response.status}). Check that every part was uploaded beside index.html.`);
      const bytes = new Uint8Array(await response.arrayBuffer());
      buffers.push(bytes);
      total += bytes.byteLength;
      bar.value = i + 1;
      status.textContent = `Downloaded ${i + 1}/${parts.length} parts · ${(total / 1048576).toFixed(1)} MiB`;
    }
    if (total !== expectedBytes) throw new Error(`File size check failed: expected ${expectedBytes} bytes, received ${total}. Re-upload the package files.`);

    status.textContent = 'Starting the client…';
    document.open();
    const decoder = new TextDecoder('utf-8');

    // Inject the bridge patch at the end of the reconstructed client HTML, not in <head>.
    // This is intentionally late so it wraps the fetch implementation after client scripts
    // have had a chance to install their own wrappers.
    const packPatch = '<scr' + 'ipt>(function(){' +
      'var host="resourcepacks.hypixel.net";' +
      'function rewriteResourcePack(value){' +
        'var raw=typeof value==="string"?value:(value&&value.url?value.url:String(value));' +
        'var u=null;try{u=new URL(raw,window.location.href)}catch(e){}' +
        'if(!u||u.hostname.toLowerCase()!==host)return null;' +
        'var p=u.pathname.split("/").filter(Boolean);' +
        'if(p.length!==3||p[0]!=="SkyBlock"||!/^\\d+\\.zip$/.test(p[2]))return null;' +
        'if(p[2]!=="88.zip")return null;' +
        'return new URL("SkyBlock-26.2.zip",window.location.href).href;' +
      '}' +
      'if(typeof window.fetch==="function"){' +
        'var nativeFetch=window.fetch.bind(window);' +
        'window.fetch=function(input,init){' +
          'var local=rewriteResourcePack(input);' +
          'if(local){console.info("[DylanClient pack patch] Using locally hosted official 26.2 SkyBlock pack:",local);' +
            'if(typeof Request!=="undefined"&&input instanceof Request){return nativeFetch(new Request(local,input),init)}' +
            'return nativeFetch(local,init);' +
          '}' +
          'return nativeFetch(input,init);' +
        '};' +
      '}' +
      'if(window.XMLHttpRequest&&window.XMLHttpRequest.prototype){' +
        'var nativeOpen=window.XMLHttpRequest.prototype.open;' +
        'window.XMLHttpRequest.prototype.open=function(method,url){' +
          'var local=rewriteResourcePack(url);' +
          'if(local){console.info("[DylanClient pack patch] Rewriting XHR to local official pack:",local);url=local;}' +
          'return nativeOpen.apply(this,[method,url].concat(Array.prototype.slice.call(arguments,2)));' +
        '};' +
      '}' +
      'console.info("[DylanClient pack patch] Resource-pack redirect installed");' +
    '})();</scr' + 'ipt>';

    for (let i = 0; i < buffers.length; i++) {
      let text = decoder.decode(buffers[i], {stream: i !== buffers.length - 1});
      if (i === buffers.length - 1) {
        const bodyMarker = "</body>";
        const bodyAt = text.toLowerCase().lastIndexOf(bodyMarker);
        if (bodyAt < 0) throw new Error("Could not install the resource-pack patch before </body>.");
        text = text.slice(0, bodyAt) + packPatch + text.slice(bodyAt);
      }
      buffers[i] = null;
      document.write(text);
    }
    document.write(decoder.decode());
    document.close();
  } catch (err) {
    const message = String(err && err.message || err);
    try {
      document.open();
      document.write('<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Client load failed</title><body style="font:16px system-ui;background:#090d16;color:#fff;padding:24px"><h1>Client could not be loaded</h1><p></p><p>Check that index.html, all client.partXX.bin files, and SkyBlock-26.2.zip are in the same GitHub Pages folder, then reload.</p></body>');
      document.body.querySelector('p').textContent = message;
      document.close();
    } catch (_) {
      error.textContent = message;
      status.textContent = 'Loading failed';
    }
  }
})();
</script>
</body>
</html>
